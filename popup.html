<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Printer</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main class="popup-kabuk">
        <header class="marka-alani">
            <div class="marka-ikonu" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 9V2h12v7"></path>
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                    <rect x="6" y="14" width="12" height="8"></rect>
                    <path d="M18 11h.01"></path>
                </svg>
            </div>
            <div class="marka-metni">
                <p class="marka-ust-baslik">BASKI STÜDYOSU</p>
                <h1>AI Chat Printer</h1>
                <p>Konuşmayı seç, düzenle ve temiz bir belgeye dönüştür.</p>
            </div>
        </header>

        <div id="siteDurumu" class="site-durumu bekliyor" role="status" aria-live="polite">
            <span class="site-durumu-noktasi" aria-hidden="true"></span>
            <span id="siteDurumuMetni">Etkin sekme denetleniyor…</span>
        </div>

        <div id="durumAlani" class="durum" role="status" aria-live="polite" aria-atomic="true"></div>

        <section class="ayar-bolumu" aria-labelledby="icerikAyarlariBaslik">
            <div class="bolum-basligi">
                <span>01</span>
                <h2 id="icerikAyarlariBaslik">İçerik</h2>
            </div>

            <label class="ayar-satiri" for="kodBloklari">
                <span class="ayar-metin"><strong>Kod blokları</strong><small>Kod ve artifact içeriklerini ekler.</small></span>
                <span class="anahtar"><input type="checkbox" id="kodBloklari" checked><span class="anahtar-gostergesi" aria-hidden="true"></span></span>
            </label>
            <label class="ayar-satiri" for="footerGoster">
                <span class="ayar-metin"><strong>Belge imzası</strong><small>Alt bilgi ve dışa aktarım notunu gösterir.</small></span>
                <span class="anahtar"><input type="checkbox" id="footerGoster" checked><span class="anahtar-gostergesi" aria-hidden="true"></span></span>
            </label>
            <label class="ayar-satiri" for="linkAdresleriniGoster">
                <span class="ayar-metin"><strong>Bağlantı adresleri</strong><small>Baskıda linklerin açık adresini gösterir.</small></span>
                <span class="anahtar"><input type="checkbox" id="linkAdresleriniGoster" checked><span class="anahtar-gostergesi" aria-hidden="true"></span></span>
            </label>
        </section>

        <section class="ayar-bolumu" aria-labelledby="sayfaAyarlariBaslik">
            <div class="bolum-basligi">
                <span>02</span>
                <h2 id="sayfaAyarlariBaslik">Sayfa</h2>
            </div>

            <div class="secim-izgarasi">
                <label class="secim-alani" for="yaziBoyutu"><span>Yazı</span><select id="yaziBoyutu"><option value="11">Küçük · 11 px</option><option value="13" selected>Normal · 13 px</option><option value="15">Büyük · 15 px</option><option value="17">Çok büyük · 17 px</option></select></label>
                <label class="secim-alani" for="kagitBoyutu"><span>Kâğıt</span><select id="kagitBoyutu"><option value="A4" selected>A4</option><option value="A3">A3</option><option value="Letter">Letter</option></select></label>
                <label class="secim-alani" for="yonlendirme"><span>Yön</span><select id="yonlendirme"><option value="portrait" selected>Dikey</option><option value="landscape">Yatay</option></select></label>
                <label class="secim-alani" for="kenarBosluk"><span>Kenar</span><select id="kenarBosluk"><option value="dar">Dar</option><option value="normal" selected>Normal</option><option value="genis">Geniş</option></select></label>
            </div>

            <label class="ayar-satiri son-satir" for="otomatikYazdir">
                <span class="ayar-metin"><strong>Otomatik yazdır</strong><small>Önizleme hazır olduğunda yazdırma penceresini açar.</small></span>
                <span class="anahtar"><input type="checkbox" id="otomatikYazdir" checked><span class="anahtar-gostergesi" aria-hidden="true"></span></span>
            </label>
        </section>

        <button id="yazdirButonu" class="yazdir-butonu" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            <span id="yazdirButonMetni">Konuşmayı Önizle</span>
            <span class="buton-oku" aria-hidden="true">→</span>
        </button>

        <footer class="alt-bilgi">
            <span>Kısayol <kbd>Ctrl</kbd><span>+</span><kbd>Shift</kbd><span>+</span><kbd>P</kbd></span>
            <span id="surumBilgisi">AI Chat Printer</span>
        </footer>
    </main>

    <script src="site-yardimcilari.js"></script>
    <script src="ortak-yardimcilar.js"></script>
    <script src="popup.js"></script>
</body>
</html>
